# Control de calidad en cada PR y en cada push a la rama borrador.
name: Control de calidad
on:
  pull_request:
  push:
    branches: [borrador]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-qa
          path: qa/
  lighthouse:
    runs-on: ubuntu-latest
    env:
      INDEXAR: si # para que Lighthouse mida el SEO como en producción
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx -y @lhci/cli@0.15.1 autorun
