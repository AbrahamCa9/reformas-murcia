# Publica en Hostinger por FTP en cada push a main.
# No hace nada hasta que exista la variable DEPLOY_ENABLED = true
# (GitHub → Settings → Secrets and variables → Actions → Variables).
# Secretos necesarios: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Publicar en Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: despliegue
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      INDEXAR: si
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Estricto: no publica si quedan borradores, datos legales o pendientes en negocio.yaml
      - run: npm run qa -- --estricto
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
