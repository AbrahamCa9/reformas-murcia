# Publica en Hostinger por FTP en cada push a main.
# No hace nada hasta que exista la variable DEPLOY_ENABLED = true
# (GitHub → Settings → Secrets and variables → Actions → Variables).
# Secretos necesarios: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Opcionales: TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID (presupuestos y avisos por Telegram).
# Solo este build recibe el token: lo escribe en api/config.php, que Hostinger no sirve por web.
name: Publicar en Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: despliegue
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publicar:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      INDEXAR: si
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Estricto: no publica si quedan borradores, datos legales o pendientes en negocio.yaml
      - run: npm run qa -- --estricto
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
      - name: Avisar por Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ESTADO: ${{ job.status }}
          REGISTRO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ESTADO" = "success" ]; then
            node scripts/avisar-telegram.mjs "✅ Web publicada en Hostinger."
          else
            node scripts/avisar-telegram.mjs "❌ No se ha podido publicar la web. Qué ha fallado: $REGISTRO"
          fi
