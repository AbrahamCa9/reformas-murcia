# Fotos de la web.
#
# Cómo añadir una: pon aquí su `archivo` (nombre SEO, sin extensión), la `url` de origen y el `alt`,
# y haz push a `borrador`. El workflow "Importar fotos" la descarga, la optimiza a WebP y la guarda
# en src/assets/fotos/{archivo}.webp (también a mano con `npm run fotos`, si hay acceso a la URL).
#
# Las fotos de IA son solo de AMBIENTE. Las de "trabajos realizados" tienen que ser reales.
